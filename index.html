<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moliya paneli</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   Moliya paneli — Telegram ichida ochiladi, faqat ko'rish uchun.
   Dizayn: AI CRM / Call Center OS oilasi (Apple HIG palitrasi).
   Qoida: rang faqat muammoni belgilaydi; grafik seriyalari — tekshirilgan
   2 rangli palitra (ko'k: daromad / asosiy, to'q sariq: chiqim).
   Ma'lumot sahifada saqlanmaydi: har ochilganda botdan imzo bilan so'raladi.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#F5F5F7; --card:#FFFFFF;
  --sep:rgba(60,60,67,.24); --sep-soft:rgba(60,60,67,.10);
  --ink:#1D1D1F; --ink-2:rgba(60,60,67,.66); --ink-3:rgba(60,60,67,.38);
  --blue:#0071E3; --red:#D70015; --red-bg:rgba(255,59,48,.12);
  --orange:#B25000; --orange-bg:rgba(255,149,0,.14);
  --fill:rgba(120,120,128,.10);
  --s1:#2a78d6; --s2:#eb6834;            /* grafik seriyalari (tekshirilgan) */
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 0 0 .5px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.04);
  --r:14px; --r-s:10px;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --card:#1C1C1E;
    --sep:rgba(84,84,88,.62); --sep-soft:rgba(84,84,88,.30);
    --ink:#F5F5F7; --ink-2:rgba(235,235,245,.64); --ink-3:rgba(235,235,245,.34);
    --blue:#0A84FF; --red:#FF6961; --red-bg:rgba(255,69,58,.18);
    --orange:#FFB340; --orange-bg:rgba(255,159,10,.18);
    --fill:rgba(120,120,128,.18);
    --s1:#3987e5; --s2:#d95926; --grid:#2c2c2a; --axis:#38383a;
    --shadow:0 0 0 .5px rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --card:#1C1C1E;
  --sep:rgba(84,84,88,.62); --sep-soft:rgba(84,84,88,.30);
  --ink:#F5F5F7; --ink-2:rgba(235,235,245,.64); --ink-3:rgba(235,235,245,.34);
  --blue:#0A84FF; --red:#FF6961; --red-bg:rgba(255,69,58,.18);
  --orange:#FFB340; --orange-bg:rgba(255,159,10,.18);
  --fill:rgba(120,120,128,.18);
  --s1:#3987e5; --s2:#d95926; --grid:#2c2c2a; --axis:#38383a;
  --shadow:0 0 0 .5px rgba(255,255,255,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sf);-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px 12px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){ .grid{grid-template-columns:1fr 1fr} .span2{grid-column:1/-1} }
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ch h2{font-size:15px;font-weight:600;margin:0}
.btn{appearance:none;border:0;background:var(--fill);color:var(--ink);font:500 13px var(--sf);padding:5px 10px;border-radius:8px;cursor:pointer}
.btn:active{opacity:.7}
/* Asosiy raqam — bitta */
.hero .lbl{font-size:13px;color:var(--ink-2)}
.hero .val{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:2px 0}
.hero .sub{font-size:15px;color:var(--ink-2)}
.parts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.parts b{color:var(--ink);font-weight:600}
.note{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:var(--r-s);background:var(--orange-bg);color:var(--orange)}
/* KPI */
.k2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi .lbl{font-size:13px;color:var(--ink-2)}
.kpi .val{font-size:24px;font-weight:650;letter-spacing:-.01em;margin:2px 0}
.kpi .kf{font-size:12.5px;color:var(--ink-2)}
.kpi .of{font-size:15px;font-weight:500;color:var(--ink-2)}
.kpi .kf.yomon{color:var(--red)}
.meter{height:8px;border-radius:4px;background:color-mix(in srgb,var(--s1) 18%,transparent);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--s1);border-radius:4px}
/* Grafik */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11px var(--sf);fill:var(--ink-2)}
.chart .tick{font-variant-numeric:tabular-nums;fill:var(--ink-3)}
.chart .lab{fill:var(--ink);font-weight:600}
.g-grid{stroke:var(--grid);stroke-width:1}
.g-axis{stroke:var(--axis);stroke-width:1}
.m1{fill:var(--s1)} .m2{fill:var(--s2)}
.ln{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--s1);opacity:.10}
.dot{fill:var(--s1);stroke:var(--card);stroke-width:2}
.xh{stroke:var(--ink-3);stroke-width:1}
.hit{fill:transparent;cursor:pointer}
.hit:hover + .mk, .mk.on{opacity:.8}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin:-2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--card);color:var(--ink);box-shadow:0 0 0 .5px var(--sep),0 8px 24px -8px rgba(0,0,0,.25);
  border-radius:10px;padding:8px 10px;font-size:12.5px;min-width:120px;opacity:0}
.tip.on{opacity:1}
.tip .t{color:var(--ink-2);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r b{font-weight:650;font-variant-numeric:tabular-nums}
.tip .k{width:10px;height:2px;border-radius:1px;display:inline-block;margin-right:6px}
/* Ro'yxatlar va jadval */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,36%) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{min-width:0}
.bar .fl{height:12px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bar .v{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px}
.rows{display:grid}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:.5px solid var(--sep-soft);font-size:14px}
.row:first-child{border-top:0}
.row .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .yomon{color:var(--red);font-weight:600}
.sub-h{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:12px 0 2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-top:.5px solid var(--sep-soft);vertical-align:top}
th{font-weight:500;color:var(--ink-2);border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;margin:0 -4px}
.hidden{display:none}
.markaz{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--ink-2);padding:20px}
.eski{opacity:.55;transition:opacity .2s}
</style>
</head>
<body>
<main id="app"><div class="markaz">Yuklanmoqda…</div></main>
<div class="tip" id="tip" role="status"></div>
<script>
'use strict';
const API = 'https://rrinmhowgjxqftbwzpus.supabase.co/functions/v1/bot?panel=1';
const tgApp = window.Telegram && window.Telegram.WebApp;
const OYLAR = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
let D = null;

// ─── Formatlash ─────────────────────────────────────────────────
const guruh = (n, kasr = 0) => {
  const [b, k] = Math.abs(n).toFixed(kasr).split('.');
  return (n < 0 ? '−' : '') + b.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (k && +k ? ',' + k : '');
};
const som = (n) => guruh(Math.round(n)) + " so'm";
const qisqa = (n) => {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e9) return s + String(+(a / 1e9).toFixed(2)).replace('.', ',') + ' mlrd';
  if (a >= 1e6) return s + String(+(a / 1e6).toFixed(a >= 1e8 ? 0 : a >= 1e7 ? 1 : 2)).replace('.', ',') + ' mln';
  if (a >= 1e4) return s + Math.round(a / 1e3) + ' ming';
  return guruh(n);
};
const dollar = (n) => (n < 0 ? '−$' : '$') + guruh(Math.abs(n), Math.abs(n) < 100 && Math.round(n) !== n ? 2 : 0);
const pul = (n, v) => v === 'UZS' ? som(n) : v === 'USDT' ? guruh(n, Math.abs(n) < 100 ? 2 : 0) + ' USDT' : dollar(n);
const oyNomi = (ym) => { const [y, m] = ym.split('-').map(Number); return OYLAR[m - 1]; };
const QISQA = ['yan', 'fev', 'mar', 'apr', 'may', 'iyun', 'iyul', 'avg', 'sen', 'okt', 'noy', 'dek'];
const oyQisqa = (ym) => QISQA[+ym.slice(5, 7) - 1];
const sanaM = (s) => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return d + '-' + OYLAR[m - 1]; };

// ─── DOM (matn faqat textContent orqali) ────────────────────────
function el(tag, cls, ...bolalar) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const b of bolalar.flat()) if (b != null && b !== false) e.append(b instanceof Node ? b : document.createTextNode(String(b)));
  return e;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attr = {}, matn) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attr)) e.setAttribute(k, v);
  if (matn != null) e.textContent = matn;
  return e;
}
function karta(sarlavha, { span2 = false, jadval = null } = {}) {
  const c = el('section', 'card' + (span2 ? ' span2' : ''));
  const h = el('div', 'ch', el('h2', null, sarlavha));
  c.append(h);
  const tana = el('div');
  c.append(tana);
  if (jadval) {
    // Har grafikning jadval ko'rinishi (rangsiz ham o'qiladi).
    const t = el('div', 'hidden scroll', jadval());
    const b = el('button', 'btn', 'Jadval');
    b.type = 'button';
    b.onclick = () => { const j = t.classList.toggle('hidden'); tana.classList.toggle('hidden', !j); b.textContent = j ? 'Jadval' : 'Grafik'; };
    h.append(b);
    c.append(t);
  }
  return { c, tana };
}
function jadval(ustunlar, qatorlar) {
  const t = el('table');
  const h = el('tr');
  ustunlar.forEach(([nom, n]) => h.append(el('th', n ? 'n' : null, nom)));
  t.append(el('thead', null, h));
  const tb = el('tbody');
  for (const q of qatorlar) {
    const tr = el('tr');
    q.forEach((v, i) => tr.append(el('td', ustunlar[i][1] ? 'n' : null, v)));
    tb.append(tr);
  }
  t.append(tb);
  return t;
}

// ─── Tooltip ────────────────────────────────────────────────────
const tip = document.getElementById('tip');
function tipKorsat(ev, sarlavha, qatorlar) {
  tip.replaceChildren(el('div', 't', sarlavha), ...qatorlar.map(([rang, nom, qiymat]) => {
    const k = el('span', 'k'); if (rang) k.style.background = `var(${rang})`;
    return el('div', 'r', el('span', null, rang ? k : null, nom), el('b', null, qiymat));
  }));
  tip.classList.add('on');
  const x = Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 8);
  const y = Math.max(8, ev.clientY - tip.offsetHeight - 12);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const tipYashir = () => tip.classList.remove('on');
addEventListener('scroll', tipYashir, { passive: true });

// ─── Grafiklar (SVG, haqiqiy piksel kengligida) ─────────────────
/** Toza bo'linmalar (3–5 ta), oxirgisi eng katta qiymatdan kichik emas. */
function shkala(max) {
  if (max <= 0) return { max: 1, ticks: [0] };
  const taxmin = max / 4, mag = Math.pow(10, Math.floor(Math.log10(taxmin)));
  const qadam = [1, 2, 2.5, 5, 10].map((x) => x * mag).find((s) => s >= taxmin);
  const ticks = []; for (let i = 0; i <= Math.ceil(max / qadam - 1e-9); i++) ticks.push(i * qadam);
  return { max: ticks[ticks.length - 1], ticks };
}
function ustun(x, y, w, h) { // 4px yumaloq uch, asosda to'g'ri burchak
  if (h <= 0) return '';
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

/** Guruhlangan ustunlar: oylar × (daromad, chiqim). */
function guruhUstun(joy, qatorlar, seriyalar) {
  const W = joy.clientWidth || 340, H = 190, chap = 44, past = 22, tepa = 16;
  const { max, ticks } = shkala(Math.max(...qatorlar.flatMap((q) => seriyalar.map((s) => q[s.kalit]))));
  const y = (v) => tepa + (H - tepa - past) * (1 - v / max);
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img' });
  for (const t of ticks) {
    svg.append(sv('line', { x1: chap, x2: W, y1: y(t), y2: y(t), class: t === 0 ? 'g-axis' : 'g-grid' }));
    svg.append(sv('text', { x: chap - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, qisqa(t).replace(' mln', 'm').replace(' ming', 'k')));
  }
  const band = (W - chap) / qatorlar.length;
  const bw = Math.min(24, (band - 14) / seriyalar.length - 2);
  qatorlar.forEach((q, i) => {
    const x0 = chap + band * i + (band - (bw * seriyalar.length + 2 * (seriyalar.length - 1))) / 2;
    const g = sv('g');
    seriyalar.forEach((s, j) => {
      const v = q[s.kalit];
      g.append(sv('path', { d: ustun(x0 + j * (bw + 2), y(v), bw, y(0) - y(v)), class: s.sinf + ' mk' }));
    });
    // Yonma-yon ustunlarga yorliq sig'maydi — qiymatlar tooltip va jadvalda.
    g.append(sv('text', { x: chap + band * i + band / 2, y: H - 6, 'text-anchor': 'middle' }, oyQisqa(q.oy)));
    const hit = sv('rect', { x: chap + band * i, y: tepa, width: band, height: H - tepa - past, class: 'hit', tabindex: 0 });
    const korsat = (ev) => tipKorsat(ev, oyNomi(q.oy), seriyalar.map((s) => [s.rang, s.nom, qisqa(q[s.kalit]) + " so'm"]));
    hit.addEventListener('pointermove', korsat); hit.addEventListener('pointerleave', tipYashir);
    hit.addEventListener('focus', () => { const b = hit.getBoundingClientRect(); korsat({ clientX: b.left + b.width / 2, clientY: b.top + 30 }); });
    hit.addEventListener('blur', tipYashir);
    svg.append(g, hit);
  });
  joy.append(svg);
}

/** Bitta seriya ustunlar (kunlar). Faqat eng katta kunga yorliq. */
function ustunlar(joy, qatorlar, { nom, yorliq }) {
  const W = joy.clientWidth || 340, H = 150, chap = 44, past = 20, tepa = 16;
  const eng = Math.max(...qatorlar.map((q) => q.v));
  const { max, ticks } = shkala(eng);
  const y = (v) => tepa + (H - tepa - past) * (1 - v / max);
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img' });
  for (const t of ticks) {
    svg.append(sv('line', { x1: chap, x2: W, y1: y(t), y2: y(t), class: t === 0 ? 'g-axis' : 'g-grid' }));
    svg.append(sv('text', { x: chap - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, qisqa(t).replace(' mln', 'm').replace(' ming', 'k')));
  }
  const band = (W - chap) / qatorlar.length;
  const bw = Math.max(2, Math.min(24, band - 2));
  qatorlar.forEach((q, i) => {
    const x = chap + band * i + (band - bw) / 2;
    svg.append(sv('path', { d: ustun(x, y(q.v), bw, y(0) - y(q.v)), class: 'm1' }));
    if (q.v === eng && eng > 0) {
      const lx = Math.min(Math.max(x + bw / 2, chap + 20), W - 20);
      svg.append(sv('text', { x: lx, y: y(q.v) - 4, 'text-anchor': 'middle', class: 'lab' }, qisqa(q.v).replace(' mln', 'm').replace(' ming', 'k')));
    }
    if (qatorlar.length <= 12 || i % 5 === 0 || i === qatorlar.length - 1) {
      svg.append(sv('text', { x: chap + band * i + band / 2, y: H - 5, 'text-anchor': 'middle' }, yorliq(q)));
    }
    const hit = sv('rect', { x: chap + band * i, y: tepa, width: band, height: H - tepa - past, class: 'hit' });
    hit.addEventListener('pointermove', (ev) => tipKorsat(ev, q.sarlavha, [['--s1', nom, som(q.v)]]));
    hit.addEventListener('pointerleave', tipYashir);
    svg.append(hit);
  });
  joy.append(svg);
}

/** Chiziq (kripto jami) — yuvilgan maydon, oxirgi nuqtada qiymat, kursor chizig'i. */
function chiziq(joy, nuqtalar) {
  const W = joy.clientWidth || 340, H = 160, chap = 44, past = 20, tepa = 18, ong = 12;
  const qiymatlar = nuqtalar.map((n) => n.v);
  // Toza bo'linmalar: oraliq 2–3 qadamga bo'linadi, chegaralar qadamga yaxlitlanadi.
  const mn = Math.min(...qiymatlar), mx = Math.max(...qiymatlar);
  const taxmin = Math.max((mx - mn) / 3, mx * 0.01, 1), mag = Math.pow(10, Math.floor(Math.log10(taxmin)));
  const qadam = [1, 2, 2.5, 5, 10].map((x) => x * mag).find((s) => s >= taxmin);
  const lo = Math.max(0, Math.floor(mn / qadam) * qadam), hi = Math.max(lo + qadam, Math.ceil(mx / qadam) * qadam);
  const ticks = []; for (let t = lo; t <= hi + 1e-9; t += qadam) ticks.push(t);
  const x = (i) => chap + (W - chap - ong) * (nuqtalar.length === 1 ? 1 : i / (nuqtalar.length - 1));
  const y = (v) => tepa + (H - tepa - past) * (1 - (v - lo) / (hi - lo));
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img' });
  ticks.forEach((t, i) => {
    svg.append(sv('line', { x1: chap, x2: W - ong, y1: y(t), y2: y(t), class: i === 0 ? 'g-axis' : 'g-grid' }));
    svg.append(sv('text', { x: chap - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, guruh(t)));
  });
  const d = nuqtalar.map((n, i) => `${i ? 'L' : 'M'}${x(i)},${y(n.v)}`).join('');
  svg.append(sv('path', { d: `${d}L${x(nuqtalar.length - 1)},${y(lo)}L${x(0)},${y(lo)}Z`, class: 'ar' }));
  svg.append(sv('path', { d, class: 'ln' }));
  [0, nuqtalar.length - 1].forEach((i, j) => svg.append(sv('text', { x: x(i), y: H - 5, 'text-anchor': j ? 'end' : 'start' }, sanaM(nuqtalar[i].s))));
  const oxir = nuqtalar.length - 1;
  svg.append(sv('circle', { cx: x(oxir), cy: y(nuqtalar[oxir].v), r: 4, class: 'dot' }));
  svg.append(sv('text', { x: x(oxir), y: y(nuqtalar[oxir].v) - 9, 'text-anchor': 'end', class: 'lab' }, guruh(nuqtalar[oxir].v)));
  const xh = sv('line', { y1: tepa, y2: H - past, class: 'xh', visibility: 'hidden' });
  const nuqta = sv('circle', { r: 4, class: 'dot', visibility: 'hidden' });
  svg.append(xh, nuqta);
  const hit = sv('rect', { x: chap, y: 0, width: W - chap, height: H, class: 'hit' });
  hit.addEventListener('pointermove', (ev) => {
    const b = svg.getBoundingClientRect();
    const px = (ev.clientX - b.left) * (W / b.width);
    const i = Math.max(0, Math.min(oxir, Math.round(((px - chap) / (W - chap - ong)) * oxir)));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    nuqta.setAttribute('cx', x(i)); nuqta.setAttribute('cy', y(nuqtalar[i].v)); nuqta.setAttribute('visibility', 'visible');
    tipKorsat(ev, sanaM(nuqtalar[i].s), [['--s1', 'Bitget', guruh(nuqtalar[i].v, 0) + ' USDT']]);
  });
  hit.addEventListener('pointerleave', () => { tipYashir(); xh.setAttribute('visibility', 'hidden'); nuqta.setAttribute('visibility', 'hidden'); });
  svg.append(hit);
  joy.append(svg);
}

// ─── Sahifa ─────────────────────────────────────────────────────
function chiz() {
  const d = D, app = document.getElementById('app');
  const oyN = oyNomi(d.bugun.slice(0, 7));
  const Oy = oyN[0].toUpperCase() + oyN.slice(1);
  const g = el('div', 'grid');

  // Asosiy raqam: sof boylik
  const hero = el('section', 'card hero span2',
    el('div', 'lbl', 'Sof boylik'),
    el('div', 'val', qisqa(d.sof.jami) + " so'm"),
    el('div', 'sub', dollar(Math.round(d.sof.jami / d.kurs)) + ' · 1$ = ' + guruh(d.kurs) + " so'm"),
    el('div', 'parts',
      el('span', null, 'Pul ', el('b', null, qisqa(d.sof.pul))),
      d.sof.loyiha ? el('span', null, 'Loyiha ulushi ', el('b', null, qisqa(d.sof.loyiha))) : null,
      el('span', null, 'Mulk ', el('b', null, qisqa(d.sof.mulk))),
      el('span', null, 'Sizga qarzdor ', el('b', null, qisqa(d.sof.menga))),
      el('span', null, 'Siz qarzdorsiz ', el('b', null, qisqa(d.sof.mendan)))),
    d.sof.kiritilmagan.length ? el('div', 'note', "Qoldig'i kiritilmagan: " + d.sof.kiritilmagan.join(', ') + '. Botga yozing: qoldiq kapital 1 250 000, …') : null);
  g.append(hero);

  // KPI
  const kpi = (lbl, val, kf, yomon, extra) => el('section', 'card kpi', el('div', 'lbl', lbl), el('div', 'val', val), extra || null, kf ? el('div', 'kf' + (yomon ? ' yomon' : ''), kf) : null);
  const farq = d.oy.otganShuKungacha > 0 ? Math.round((d.oy.chiqim / d.oy.otganShuKungacha - 1) * 100) : null;
  const k2 = el('div', 'k2 span2');
  k2.append(kpi(Oy + ' chiqimi', qisqa(d.oy.chiqim), farq == null ? "o'tgan oy bilan solishtirish keyin" : `${farq >= 0 ? '+' : '−'}${Math.abs(farq)}% o'tgan oy shu kungacha`, farq > 10));
  k2.append(kpi(Oy + ' daromadi', qisqa(d.oy.daromad), d.oy.daromad >= d.oy.chiqim ? 'chiqimdan ko\'p' : 'chiqimdan kam', d.oy.daromad < d.oy.chiqim && d.oy.daromad > 0));
  if (d.maqsad) {
    const m = d.maqsad;
    const meter = el('div', 'meter'); const fill = el('i'); fill.style.width = Math.max(1, m.foiz) + '%'; meter.append(fill);
    k2.append(kpi(m.nomi, el('span', null, dollar(Math.round(m.yigilgan)), el('span', 'of', ' / ' + dollar(m.maqsad))),
      m.qolgan > 0 && m.oylar > 0 ? `${m.foiz}% · oyiga ~${dollar(Math.round(m.oyiga / 50) * 50)} kerak` : `${m.foiz}%`, m.oylar > 0 && m.oyiga > 3000, meter));
  }
  if (d.kripto) {
    const k = d.kripto;
    k2.append(kpi('Bitget', guruh(k.jami) + ' USDT', k.oy ? `oy boshidan ${k.oy.foiz >= 0 ? '+' : '−'}${String(Math.abs(k.oy.foiz)).replace('.', ',')}%` : (k.kun ? `bugun ${k.kun.foiz}%` : null), k.ogohlantirishlar.length > 0));
  }
  g.append(k2);

  // Daromad va chiqim — oylar
  {
    const { c, tana } = karta('Daromad va chiqim', { jadval: () => jadval([['Oy'], ['Daromad', 1], ['Chiqim', 1]], d.oylar.map((q) => [oyNomi(q.oy), som(q.daromad), som(q.chiqim)])) });
    tana.append(el('div', 'legend', ...[['--s1', 'Daromad'], ['--s2', 'Chiqim']].map(([r, n]) => { const i = el('i'); i.style.background = `var(${r})`; return el('span', null, i, n); })));
    const joy = el('div', 'chart'); tana.append(joy); g.append(c);
    requestAnimationFrame(() => guruhUstun(joy, d.oylar, [{ kalit: 'daromad', nom: 'Daromad', sinf: 'm1', rang: '--s1' }, { kalit: 'chiqim', nom: 'Chiqim', sinf: 'm2', rang: '--s2' }]));
  }

  // Bu oy kategoriyalar
  {
    const { c, tana } = karta(Oy + ' — nimaga ketdi');
    if (!d.oy.kategoriyalar.length) tana.append(el('div', 'muted small', "Bu oy hali xarajat yozilmagan."));
    const max = Math.max(...d.oy.kategoriyalar.map((x) => x.som), 1);
    const bars = el('div', 'bars');
    for (const x of d.oy.kategoriyalar) {
      const fl = el('div', 'fl'); fl.style.width = Math.max(1, (x.som / max) * 100) + '%';
      bars.append(el('div', 'bar', el('div', 'nm', x.belgi + ' ' + x.nomi), el('div', 'tr', fl),
        el('span', 'v', qisqa(x.som) + ' · ' + Math.round((x.som / (d.oy.chiqim || 1)) * 100) + '%')));
    }
    tana.append(bars); g.append(c);
  }

  // Kunlik chiqim
  {
    const { c, tana } = karta('Kunlik chiqim — ' + oyN, { jadval: () => jadval([['Kun'], ['Chiqim', 1]], d.kunlar.filter((q) => q.chiqim > 0).map((q) => [sanaM(q.kun), som(q.chiqim)])) });
    const joy = el('div', 'chart'); tana.append(joy); g.append(c);
    requestAnimationFrame(() => ustunlar(joy, d.kunlar.map((q) => ({ v: q.chiqim, sarlavha: sanaM(q.kun), kun: +q.kun.slice(8) })), { nom: 'Chiqim', yorliq: (q) => q.kun }));
  }

  // Loyihalar
  for (const l of d.loyihalar) {
    const { c, tana } = karta('🕌 ' + l.nomi);
    const rows = el('div', 'rows');
    const row = (a, b, cls) => rows.append(el('div', 'row', el('span', 'muted', a), el('span', 'r' + (cls ? ' ' + cls : ''), b)));
    row('Kassada', pul(l.kassa, l.valyuta));
    row('Sizga tegishli', pul(Math.max(0, l.menga), l.valyuta));
    row(oyN + ': tushdi / xarajat', pul(l.oy.tushum, l.valyuta) + ' / ' + pul(l.oy.xarajat, l.valyuta));
    if (l.mijozQarzi > 0) row('Mijoz qarzi', '⚠️ ' + pul(l.mijozQarzi, l.valyuta), 'yomon');
    if (l.ortachaKechikish != null) row("O'rtacha kechikish", l.ortachaKechikish + ' kun', l.ortachaKechikish > 7 ? 'yomon' : '');
    for (const k of l.kutilmoqda) {
      const holat = k.kechikish > 0 ? `⚠️ ${k.kechikish} kun kechikmoqda` : k.kechikish === 0 ? 'bugun' : sanaM(k.muddat);
      row(k.nomi.replace(/ \d{4}-\d{2}.*/, '') + ' ' + pul(k.qolgan, l.valyuta), holat, k.kechikish > 0 ? 'yomon' : '');
    }
    tana.append(rows); g.append(c);
  }

  // To'lovlar va qarzlar
  {
    const { c, tana } = karta("To'lovlar va qarzlar");
    if (d.doimiylar.length) {
      tana.append(el('div', 'sub-h', "Yaqin to'lovlar"));
      const r = el('div', 'rows');
      for (const x of d.doimiylar) {
        const q = x.holat === 'otgan' ? `⚠️ ${-x.farq} kun o'tdi` : x.holat === 'bugun' ? 'bugun' : x.farq === 1 ? 'ertaga' : sanaM(x.muddat);
        r.append(el('div', 'row', el('span', null, x.nomi + ' · ' + pul(x.summa, x.valyuta)), el('span', 'r' + (x.holat === 'otgan' ? ' yomon' : ' muted'), q)));
      }
      tana.append(r);
    }
    const menga = d.qarzlar.filter((x) => x.qoldiq > 0), mendan = d.qarzlar.filter((x) => x.qoldiq < 0);
    for (const [nom, roy, ish] of [['Sizga qarzdor', menga, 1], ['Siz qarzdorsiz', mendan, -1]]) {
      if (!roy.length) continue;
      tana.append(el('div', 'sub-h', nom));
      const r = el('div', 'rows');
      for (const x of roy) r.append(el('div', 'row', el('span', null, x.ism), el('span', 'r', pul(ish * x.qoldiq, x.valyuta))));
      tana.append(r);
    }
    g.append(c);
  }

  // Kripto
  if (d.kripto) {
    const k = d.kripto;
    const { c, tana } = karta('₿ Bitget', { jadval: () => jadval([['Coin'], ['Qiymat', 1], ['Natija', 1]], k.aktivlar.map((a) => [a.coin, dollar(Math.round(a.qiymat)), a.foyda == null ? '—' : (a.foyda >= 0 ? '+' : '') + a.foyda + '%'])) });
    if (k.tarix.length >= 2) { const joy = el('div', 'chart'); tana.append(joy); requestAnimationFrame(() => chiziq(joy, k.tarix.map((t) => ({ s: t.sana, v: t.jami })))); }
    for (const o of k.ogohlantirishlar) tana.append(el('div', 'note', o.replace(/^⚠️\s*/, '⚠️ ')));
    const r = el('div', 'rows');
    for (const a of k.aktivlar.slice(0, 10)) {
      const f = a.foyda == null ? '' : ` · ${a.foyda >= 0 ? '+' : '−'}${String(Math.abs(a.foyda)).replace('.', ',')}%`;
      r.append(el('div', 'row', el('span', null, a.coin + (a.guruh === 'memecoin' ? ' · memecoin' : '')), el('span', 'r', dollar(Math.round(a.qiymat)) + f)));
    }
    tana.append(el('div', 'sub-h', 'Spot portfel'), r);
    g.append(c);
  }

  // Hisoblar
  {
    const { c, tana } = karta('Hisoblar');
    const r = el('div', 'rows');
    for (const h of d.hisoblar) r.append(el('div', 'row', el('span', null, h.nomi), el('span', 'r', pul(h.qoldiq, h.valyuta))));
    tana.append(r); g.append(c);
  }

  // Oxirgi yozuvlar
  {
    const { c, tana } = karta('Oxirgi yozuvlar', { span2: true });
    const tavsif = (y) => y.turi === 'otkazma' ? `${y.hisob} → ${y.ga_hisob}` : y.turi.startsWith('qarz') ? `${y.shaxs} · ${y.turi.replace('_', ' ')}` : `${y.belgi} ${y.loyiha ? y.loyiha + ' · ' : ''}${y.kategoriya}`;
    const ish = (y) => ['kirim', 'qarz_oldim', 'qarz_qaytdi'].includes(y.turi) ? '+' : y.turi === 'otkazma' ? '' : '−';
    tana.append(el('div', 'scroll', jadval([['Sana'], ['Nima'], ['Summa', 1]],
      d.oxirgi.map((y) => [sanaM(y.sana) + ' ' + y.sana.slice(11), tavsif(y) + (y.izoh ? ' — ' + y.izoh : ''), ish(y) + pul(y.summa, y.valyuta)]))));
    g.append(c);
  }

  const yangila = el('button', 'btn', 'Yangilash'); yangila.type = 'button'; yangila.onclick = yukla;
  app.replaceChildren(el('header', null, el('div', null, el('h1', null, 'Moliya'), el('div', 'muted small', sanaM(d.bugun) + ' · kurs ' + sanaM(d.kursSana === 'taxminiy' ? d.bugun : d.kursSana))), yangila), g);
}

async function yukla() {
  const app = document.getElementById('app');
  if (D) app.classList.add('eski'); // qayta yuklashda eski ko'rinish turadi
  try {
    if (window.__PANEL_DATA__) { D = window.__PANEL_DATA__; }
    else {
      const initData = tgApp && tgApp.initData;
      if (!initData) { app.replaceChildren(el('div', 'markaz', "Panelni Telegram'dagi bot orqali oching: 📊 Holat → 📈 Panelni ochish.")); return; }
      const r = await fetch(API, { method: 'POST', headers: { 'x-telegram-init-data': initData } });
      if (r.status === 401) { app.replaceChildren(el('div', 'markaz', "Ruxsat yo'q: panel faqat egasining Telegram'idan ochiladi.")); return; }
      if (!r.ok) throw new Error('Server javobi: ' + r.status);
      D = await r.json();
    }
    chiz();
  } catch (e) {
    if (!D) app.replaceChildren(el('div', 'markaz', "Yuklab bo'lmadi: " + e.message + '. Qayta urinib ko\'ring.'));
  } finally {
    app.classList.remove('eski');
  }
}

if (tgApp) {
  tgApp.ready(); tgApp.expand();
  const mavzu = () => document.documentElement.setAttribute('data-theme', tgApp.colorScheme === 'dark' ? 'dark' : 'light');
  if (tgApp.initData) { mavzu(); tgApp.onEvent('themeChanged', mavzu); }
}
let oxirgiKenglik = innerWidth;
addEventListener('resize', () => { if (D && Math.abs(innerWidth - oxirgiKenglik) > 40) { oxirgiKenglik = innerWidth; chiz(); } });
yukla();
</script>
